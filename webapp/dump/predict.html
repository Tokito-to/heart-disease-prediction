<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Assessment | HeartGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <custom-navbar></custom-navbar>

    <main class="flex-grow">
        <!-- Info Section -->
        <section class="py-12 bg-white">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-12">
                    <h1 class="text-3xl font-bold text-gray-900 mb-4">Heart Disease Risk Assessment</h1>
                    <p class="text-lg text-gray-600">Our AI model analyzes key health indicators to assess your cardiovascular risk</p>
                </div>
            </div>
        </section>

<!-- Prediction Form Section -->
        <section id="predict" class="py-16 bg-gray-50">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="bg-white rounded-xl shadow-lg p-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">Complete Your Assessment</h2>
                    <form class="space-y-6">
                        <!-- Form fields from index.html moved here -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Age -->
                            <div>
                                <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                                <input type="number" id="age" name="age" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                            </div>

                            <!-- Gender -->
                            <div>
                                <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                                <select id="gender" name="gender" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>

                            <!-- Chest Pain Type -->
                            <div>
                                <label for="chest-pain" class="block text-sm font-medium text-gray-700 mb-1">Chest Pain Type</label>
                                <select id="chest-pain" name="chest-pain" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                                    <option value="0">Typical Angina</option>
                                    <option value="1">Atypical Angina</option>
                                    <option value="2">Non-anginal Pain</option>
                                    <option value="3">Asymptomatic</option>
                                </select>
                            </div>

                            <!-- Resting Blood Pressure -->
                            <div>
                                <label for="bp" class="block text-sm font-medium text-gray-700 mb-1">Resting Blood Pressure (mm Hg)</label>
                                <input type="number" id="bp" name="bp" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                            </div>

                            <!-- Cholesterol -->
                            <div>
                                <label for="cholesterol" class="block text-sm font-medium text-gray-700 mb-1">Cholesterol (mg/dl)</label>
                                <input type="number" id="cholesterol" name="cholesterol" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                            </div>

                            <!-- Fasting Blood Sugar -->
                            <div>
                                <label for="sugar" class="block text-sm font-medium text-gray-700 mb-1">Fasting Blood Sugar > 120 mg/dl</label>
                                <select id="sugar" name="sugar" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-red-500 focus:border-red-500">
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-md transition duration-300 flex items-center justify-center">
                                <i data-feather="activity" class="mr-2"></i> Get Prediction
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Results Section (Initially Hidden) -->
        <section id="results" class="py-16 bg-white hidden">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <div class="bg-gray-50 p-8 rounded-xl shadow-lg">
                    <div class="mb-6">
                        <i data-feather="heart" class="w-16 h-16 mx-auto text-red-500"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-4">Your Heart Health Assessment</h3>
                    <div id="prediction-result" class="text-4xl font-bold mb-6 text-red-600">Loading...</div>
                    <p id="result-description" class="text-lg text-gray-600 mb-6">Our AI model is analyzing your data to provide a personalized assessment.</p>
                    <div class="bg-white p-4 rounded-lg text-left mb-6">
                        <h4 class="font-semibold text-gray-800 mb-2">Recommendations:</h4>
                        <ul id="recommendations" class="list-disc pl-5 space-y-1">
                            <!-- Recommendations will be inserted here by JavaScript -->
                        </ul>
                    </div>
                    <button id="new-assessment" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-6 rounded-md transition duration-300">
                        Start New Assessment
                    </button>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
